name: Cotes Winamax

on:
  schedule:
    - cron: '*/30 * * * *'   # toutes les 30 min (GitHub peut décaler un peu)
  workflow_dispatch:          # bouton "Run workflow" manuel sur GitHub

permissions:
  contents: write

concurrency:
  group: cotes-winamax
  cancel-in-progress: false

jobs:
  cotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lire les cotes Winamax (Ligue 1)
        run: python3 update_cotes.py cotes.json

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add cotes.json
          git diff --staged --quiet || git commit -m "Cotes Winamax Ligue 1"
          git pull --rebase
          git push
