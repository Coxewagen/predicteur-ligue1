name: Blessés Ligue 1 (Transfermarkt)

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

jobs:
  blesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Lire les blessés
        run: python scripts/blesses.py
      - name: Enregistrer si changement
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add blesses.json 2>/dev/null || true
          git diff --cached --quiet && echo "rien à enregistrer" && exit 0
          git commit -m "Blessés Ligue 1 (Transfermarkt)"
          git pull --rebase -q origin main
          git push
