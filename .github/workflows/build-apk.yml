name: Build Android APK

on:
  workflow_dispatch:   # bouton "Run workflow" manuel sur GitHub
  push:
    branches: [main]
    paths:
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
      - 'scripts/gen-twa.js'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Install Bubblewrap
        run: npm install @bubblewrap/cli@latest

      - name: Pré-configurer Bubblewrap (évite les prompts JDK/SDK interactifs)
        run: |
          mkdir -p ~/.bubblewrap
          node -e "require('fs').writeFileSync(require('os').homedir()+'/.bubblewrap/config.json', JSON.stringify({jdkPath: process.env.JAVA_HOME, androidSdkPath: process.env.ANDROID_HOME || process.env.ANDROID_SDK_ROOT}))"
          cat ~/.bubblewrap/config.json

      - name: Generate TWA project + signing key
        env:
          TWA_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/gen-twa.js

      - name: Build signed APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: predicteurL1store
          BUBBLEWRAP_KEY_PASSWORD: predicteurL1key
          CI: 'true'
        run: |
          set +e
          echo "=== lancement de bubblewrap build ===" > build-apk-debug.log
          node_modules/.bin/bubblewrap build --skipPwaValidation >> build-apk-debug.log 2>&1
          code=$?
          echo "=== fin, code de sortie: $code ===" >> build-apk-debug.log
          cat build-apk-debug.log
          exit $code

      - name: Save debug log on failure
        if: always()
        run: |
          mkdir -p debug
          { echo "== node/npm/java versions =="; node -v; npm -v; java -version 2>&1; echo; \
            echo "== bubblewrap version =="; node_modules/.bin/bubblewrap --version 2>&1 || true; echo; \
            echo "== répertoire =="; ls -la; echo; \
            echo "== twa-manifest.json =="; cat twa-manifest.json 2>&1 || true; echo; \
            echo "== manifest-checksum.txt =="; cat manifest-checksum.txt 2>&1 || true; echo; \
            echo "== build-apk-debug.log =="; cat build-apk-debug.log 2>&1 || true; } > debug/build-apk-debug.log
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git fetch origin debug-logs 2>/dev/null || true
          git checkout -B debug-logs
          git add -f debug/build-apk-debug.log
          git commit -m "debug: log du build APK (run ${{ github.run_id }}) [skip ci]" || echo "rien à committer"
          git push -f origin debug-logs

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: predicteur-ligue1-apk
          path: app-release-signed.apk

      - name: Publish APK as a stable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Prédicteur Ligue 1 — appli Android (.apk)"
          body: |
            APK généré automatiquement à partir du site
            (https://coxewagen.github.io/predicteur-ligue1/).

            Pour l'installer : télécharge `app-release-signed.apk`
            ci-dessous, autorise l'installation depuis une source
            inconnue si Android le demande, puis ouvre le fichier.

            Ce lien reste le même à chaque mise à jour — pas besoin
            de le rechercher à nouveau.
          files: app-release-signed.apk
          make_latest: false
