name: Build Android APK

on:
  workflow_dispatch:   # bouton "Run workflow" manuel sur GitHub
  push:
    branches: [main]
    paths:
      - 'icons/**'
      - 'index.html'
      - 'android.keystore'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;34.0.0'

      - name: Install Capacitor
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

      - name: Générer le projet Capacitor (le site est embarqué tel quel dans l'appli)
        # Contrairement à l'ancienne appli TWA (qui ouvrait l'URL en ligne dans un
        # onglet Chrome, avec tous les soucis de cache que ça entraînait), ici
        # index.html est copié DANS l'appli au moment du build : plus aucune
        # dépendance au cache du navigateur pour afficher les dernières données.
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html www/index.html
          cp -r icons www/icons

          node_modules/.bin/cap init "Prédicteur Ligue 1" com.coxewagen.predicteurligue1 --web-dir=www
          node_modules/.bin/cap add android
          node_modules/.bin/cap sync android

      - name: Configurer la signature et le numéro de version Android
        # On réutilise la clé de signature persistée dans le dépôt (android.keystore)
        # plutôt que d'en générer une nouvelle à chaque build — sinon Android refuse
        # la mise à jour par-dessus l'appli déjà installée ("App not installed") et
        # oblige à désinstaller à chaque fois.
        run: |
          cat >> android/app/build.gradle << 'EOF'

          // --- Ajouté par le pipeline CI : signature + version ---
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CI_KEYSTORE_PATH"))
                      storePassword System.getenv("CI_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CI_KEY_ALIAS")
                      keyPassword System.getenv("CI_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          def ciVersionCode = (System.getenv("CI_VERSION_CODE") ?: "1") as Integer
          def ciVersionName = System.getenv("CI_VERSION_NAME") ?: "1"
          android.defaultConfig.versionCode = ciVersionCode
          android.defaultConfig.versionName = ciVersionName
          EOF
          cat android/app/build.gradle | tail -25

      - name: Build de l'APK signé
        env:
          CI_KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
          CI_KEYSTORE_PASSWORD: predicteurL1store
          CI_KEY_ALIAS: android
          CI_KEY_PASSWORD: predicteurL1store
          CI_VERSION_CODE: ${{ github.run_number }}
          CI_VERSION_NAME: ${{ github.run_number }}
        run: |
          set +e
          echo "=== lancement de gradlew assembleRelease ===" > build-apk-debug.log
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon >> ../build-apk-debug.log 2>&1
          code=$?
          cd ..
          echo "=== fin, code de sortie: $code ===" >> build-apk-debug.log
          cat build-apk-debug.log
          if [ $code -eq 0 ]; then
            cp android/app/build/outputs/apk/release/app-release.apk app-release-signed.apk
          fi
          exit $code

      - name: Save debug log on failure
        if: failure()
        run: |
          mkdir -p debug
          { echo "== node/npm/java versions =="; node -v; npm -v; java -version 2>&1; echo; \
            echo "== cap doctor =="; node_modules/.bin/cap doctor 2>&1 || true; echo; \
            echo "== répertoire =="; ls -la; echo; \
            echo "== android/app/build.gradle =="; cat android/app/build.gradle 2>&1 || true; echo; \
            echo "== sorties apk générées =="; find android/app/build/outputs -type f 2>&1 || true; echo; \
            echo "== build-apk-debug.log =="; cat build-apk-debug.log 2>&1 || true; } > debug/build-apk-debug.log
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git fetch origin debug-logs 2>/dev/null || true
          git checkout -B debug-logs
          git add -f debug/build-apk-debug.log
          git commit -m "debug: log du build APK (run ${{ github.run_id }}) [skip ci]" || echo "rien à committer"
          git push -f origin debug-logs

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: predicteur-ligue1-apk
          path: app-release-signed.apk

      - name: Publish APK as a stable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Prédicteur Ligue 1 — appli Android (.apk)"
          body: |
            APK généré automatiquement. Le site est embarqué directement
            dans l'appli (plus besoin d'internet pour l'ouvrir) — utilise
            le bouton "Mettre à jour les stats" dans l'appli pour récupérer
            les derniers résultats quand tu as du réseau.

            Pour l'installer : télécharge `app-release-signed.apk`
            ci-dessous, autorise l'installation depuis une source
            inconnue si Android le demande, puis ouvre le fichier.

            Ce lien reste le même à chaque mise à jour — pas besoin
            de le rechercher à nouveau.
          files: app-release-signed.apk
          make_latest: false
